<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FloodSim Mark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* The FloodSim lockup on the SPARC Labs mark: the wireframe cube with live water inside (app/logo.js), and the
   wordmark set like SPARC LABS (heavy grotesk, two lines). Drag across the water, click to splash. */
:root { --ink: #1a1416; --muted: #6e6358; --paper: #ffffff; --line: #c9c2b3; --body: "Inter", "Helvetica Neue", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #f3eee6; --muted: #a89e90; --paper: #141012; --line: #3a3236; color-scheme: dark; } }
:root[data-theme="dark"] { --ink: #f3eee6; --muted: #a89e90; --paper: #141012; --line: #3a3236; color-scheme: dark; }
html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: var(--body); }
main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
.lockup { display: flex; align-items: center; gap: clamp(16px, 4vw, 48px); flex-wrap: wrap; justify-content: center; }
.mark { width: clamp(180px, 38vw, 440px); aspect-ratio: 1.732 / 2; display: block; color: var(--ink); --logo-paper: var(--paper); cursor: crosshair; touch-action: none; }
.word { font-weight: 900; font-size: clamp(56px, 12vw, 150px); line-height: 0.86; letter-spacing: -0.035em; text-transform: uppercase; margin: 0; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 28px; }
button { font: 600 12px var(--body); padding: 7px 12px; border-radius: 5px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.hint { font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-align: center; margin-top: 14px; }
.small { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 30px; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; }
.small canvas { width: 38px; height: 42px; display: block; color: var(--ink); --logo-paper: var(--paper); }
.small em { font-style: normal; color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<main>
  <div>
    <div class="lockup">
      <canvas class="mark" id="mark" aria-label="FloodSim mark: a wireframe cube with water floating inside"></canvas>
      <h1 class="word">Flood<br>Sim</h1>
    </div>
    <div class="bar" role="group" aria-label="Look">
      <button type="button" data-mode="sheet" aria-pressed="true">Water sheet</button>
      <button type="button" data-mode="voxel" aria-pressed="false">Voxels</button>
      <button type="button" data-tint="1" aria-pressed="true">Water tint</button>
      <button type="button" data-tint="0" aria-pressed="false">Ink only</button>
      <button type="button" data-rain aria-pressed="false">Rain</button>
      <button type="button" id="png">Download PNG</button>
    </div>
    <p class="hint">Drag across the water · click to splash</p>
    <div class="small"><canvas id="small" aria-hidden="true"></canvas><span>Flood<em>Sim</em></span></div>
  </div>
</main>
<script type="module">
import { mountLogo } from './logo.js';
let raining = false;
const big = mountLogo(document.getElementById('mark'), { rainWhile: () => raining });
const small = mountLogo(document.getElementById('small'), { rainWhile: () => raining });
const press = (sel, b) => document.querySelectorAll(sel).forEach(x => x.setAttribute('aria-pressed', x === b));
for (const b of document.querySelectorAll('[data-mode]')) b.onclick = () => { press('[data-mode]', b); big.set({ mode: b.dataset.mode }); small.set({ mode: b.dataset.mode }); };
for (const b of document.querySelectorAll('[data-tint]')) b.onclick = () => { press('[data-tint]', b); big.set({ tint: b.dataset.tint === '1' }); small.set({ tint: b.dataset.tint === '1' }); };
document.querySelector('[data-rain]').onclick = (e) => { raining = !raining; e.currentTarget.setAttribute('aria-pressed', raining); };
document.getElementById('png').onclick = () => {
  const c = document.getElementById('mark'); c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'floodsim-mark.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); });
};
</script>
</body>
</html>
