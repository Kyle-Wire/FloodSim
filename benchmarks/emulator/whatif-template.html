<title>Backyard What-If</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a two-column workbench. Controls on the left like a site notebook, the plan-view flood map on the right,
   the verdict for the house under it. One column on phones. */
:root {
  --bg: #f6f7f5; --panel: #ffffff; --ink: #1d2320; --muted: #5e6862; --rule: #dde2de;
  --water: #2a78d6; --house: #3b423e; --home: #e34948; --ok: #0c7d3c; --warn: #9a5b00; --chip: #eef3f0;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif; --f-body: Inter, "Segoe UI", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151917; --panel: #1d2220; --ink: #e8ece9; --muted: #9aa49e; --rule: #2e3532; --water: #3987e5; --house: #c9d0cc; --home: #e66767; --ok: #3fbf6e; --warn: #e0a440; --chip: #26302b; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #151917; --panel: #1d2220; --ink: #e8ece9; --muted: #9aa49e; --rule: #2e3532; --water: #3987e5; --house: #c9d0cc; --home: #e66767; --ok: #3fbf6e; --warn: #e0a440; --chip: #26302b; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 40px }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 3vw, 2.2rem); margin: 0; text-wrap: balance; letter-spacing: -0.01em }
.lede { color: var(--muted); max-width: 70ch; margin: 4px 0 0 }
.grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 16px }
fieldset { border: 0; margin: 0 0 14px; padding: 0; display: grid; gap: 10px }
legend { font-family: var(--f-display); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px }
.ctl { display: grid; gap: 2px }
.ctl label { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem }
.ctl output { font-family: var(--f-mono); font-size: 0.85rem; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap }
input[type=range] { width: 100%; accent-color: var(--water) }
input[type=range]:focus-visible { outline: 2px solid var(--water); outline-offset: 2px }
.presets { display: flex; flex-wrap: wrap; gap: 6px }
button { font: inherit; font-size: 0.82rem; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer }
button:hover { border-color: var(--water) } button:focus-visible { outline: 2px solid var(--water); outline-offset: 2px }
button[aria-pressed="true"] { background: var(--water); color: #fff; border-color: var(--water) }
.mapbox { display: grid; gap: 10px }
.tabs { display: flex; gap: 6px; flex-wrap: wrap }
canvas { width: 100%; max-width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--rule); background: var(--bg) }
.key { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--muted); flex-wrap: wrap }
.ramp { height: 10px; width: 180px; max-width: 50%; border-radius: 3px }
.verdict { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 8px; background: var(--chip) }
.pill { font-family: var(--f-display); font-weight: 700; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; color: #fff; white-space: nowrap }
.pill.ok { background: var(--ok) } .pill.warn { background: var(--warn) }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
@media (max-width: 560px) { .stats { grid-template-columns: minmax(0, 1fr) } }
.stat { border-top: 2px solid var(--rule); padding-top: 8px; min-width: 0 }
.stat .k { font-size: 0.8rem; color: var(--muted) }
.stat .v { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums }
.stat .d { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums }
.fine { font-size: 0.8rem; color: var(--muted); max-width: 90ch }
.fine b { color: var(--ink); font-weight: 600 }
</style>

<div class="wrap">
  <header>
    <h1>What if you fixed the back yard?</h1>
    <p class="lede">A synthetic block of four lots where your back yard has a low spot and your neighbor can raise theirs. Move the sliders: the flood emulator answers instantly from 136 full simulations, and says when it is not sure enough and a full simulation should run instead.</p>
  </header>
  <div class="grid">
    <section class="panel" aria-label="What changes">
      <div id="controls"></div>
      <div class="presets" aria-label="Examples">
        <button id="p-asis" type="button">As it is</button>
        <button id="p-drain" type="button">French drain</button>
        <button id="p-garden" type="button">Rain garden + barrel</button>
        <button id="p-all" type="button">Everything</button>
        <button id="p-wild" type="button">Raised neighbor, big storm</button>
      </div>
    </section>
    <section class="mapbox">
      <div class="panel" style="display:grid;gap:10px">
        <div class="tabs" role="group" aria-label="Map shows">
          <button id="t-depth" type="button" aria-pressed="true">Deepest water</button>
          <button id="t-change" type="button" aria-pressed="false">Change from no fixes</button>
          <button id="t-sd" type="button" aria-pressed="false">How sure</button>
        </div>
        <canvas id="map" width="896" height="896" aria-label="Plan view of the block with the deepest water in each square metre"></canvas>
        <div class="key"><span id="k-lo"></span><span class="ramp" id="ramp"></span><span id="k-hi"></span><span id="k-note"></span></div>
      </div>
      <div class="verdict" id="verdict"></div>
      <div class="panel stats" id="stats"></div>
      <p class="fine" id="fine"></p>
    </section>
  </div>
</div>

<script>/*__EMULATOR__*/</script>
<script>
const $ = (id) => document.getElementById(id);
const fromB64 = (s) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Float32Array(u.buffer); };
let D, em, mode = 'depth', vals = {}, zcache = {};
const GROUPS = [['you', 'Your fixes'], ['weather', 'The storm'], ['neighbor', 'Next door']];
const fmt = { ari: v => `${Math.round(v)}-yr`, wet: v => `${Math.round(v * 100)} %`, raise: v => `${(v / 0.0254).toFixed(0)} in`, french: v => v < 0.02 ? 'none' : `${Math.round(v * 100)} % size`, garden: v => v < 0.005 ? 'none' : `${(v / 0.0254).toFixed(0)} in deep`, barrel: v => v < 5 ? 'none' : `${Math.round(v / 3.785)} gal`, redirect: v => `${Math.round(v * 100)} %`, trees: v => `${Math.round(v * 100)} %` };
const PRESETS = {
  'p-asis': { french: 0, garden: 0, barrel: 0, redirect: 0, trees: 0 },
  'p-drain': { french: 1, garden: 0, barrel: 0, redirect: 0, trees: 0 },
  'p-garden': { french: 0, garden: 0.25, barrel: 750, redirect: 0, trees: 0 },
  'p-all': { french: 1, garden: 0.3, barrel: 1000, redirect: 1, trees: 0.6 },
  'p-wild': { ari: 100, wet: 0.9, raise: 0.4 },
};
function build() {
  const box = $('controls');
  for (const [who, name] of GROUPS) {
    const fs = document.createElement('fieldset'); fs.innerHTML = `<legend>${name}</legend>`;
    for (const p of D.params.filter(q => q.who === who)) {
      const id = 'c-' + p.key, d = document.createElement('div'); d.className = 'ctl';
      const steps = p.log ? 200 : 100;
      d.innerHTML = `<label for="${id}"><span>${p.label.replace(/ \(.*\)/, '')}</span><output id="o-${p.key}"></output></label><input id="${id}" type="range" min="0" max="${steps}" step="1">`;
      fs.appendChild(d);
      const inp = d.querySelector('input');
      inp.addEventListener('input', () => { vals[p.key] = fromSlider(p, +inp.value / steps); update(); });
    }
    box.appendChild(fs);
  }
  for (const id of Object.keys(PRESETS)) $(id).addEventListener('click', () => { Object.assign(vals, PRESETS[id]); sync(); update(); });
  for (const [id, m] of [['t-depth', 'depth'], ['t-change', 'change'], ['t-sd', 'sd']]) $(id).addEventListener('click', () => { mode = m; for (const t of ['t-depth', 't-change', 't-sd']) $(t).setAttribute('aria-pressed', String(t === id)); update(); });
}
const fromSlider = (p, u) => p.log ? p.min * (p.max / p.min) ** u : p.min + u * (p.max - p.min);
function sync() { for (const p of D.params) { const steps = p.log ? 200 : 100; $('c-' + p.key).value = Math.round(toUnit(p, vals[p.key]) * steps); } }
function ground(raise) { const t = raise / 0.4, k = raise.toFixed(3); if (!zcache[k]) { const z = new Float32Array(D.z0.length); for (let i = 0; i < z.length; i++) z[i] = D.z0[i] + t * (D.z1[i] - D.z0[i]); zcache = { [k]: z }; } return zcache[k]; }
function masked(full) { const o = new Float32Array(D.M); let m = 0; for (let k = 0; k < D.mask.length; k++) if (D.mask[k]) o[m++] = full[k]; return o; }
function evaluate(v) {
  const u = D.params.map(p => Math.min(1, Math.max(0, toUnit(p, v[p.key])))), p = predict(em, u), zm = masked(ground(v.raise)), depth = depthFrom(p.wse, zm);
  return { u, depth, sd: p.wseSd, sc: p.scalars };
}
function gapTo(u) { const ell = D.ell; let best = Infinity; for (const x of em.X) { let s = 0; for (let j = 0; j < u.length; j++) s += ((u[j] - x[j]) / Math.min(ell[j], 2)) ** 2; best = Math.min(best, s); } return Math.sqrt(best); }
const lerp = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
const hex = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const SEQ = ['#e8f0fb', '#b7d3f6', '#86b6ef', '#5598e7', '#2a78d6', '#1c5cab', '#104281', '#0d366b'].map(hex);
const DIV = ['#2a78d6', '#86b6ef', '#cde2fb', '#f0efec', '#f7c9c4', '#ec8f86', '#e34948'].map(hex);
const ramp = (pal, t) => { t = Math.min(1, Math.max(0, t)) * (pal.length - 1); const i = Math.min(pal.length - 2, Math.floor(t)); return lerp(pal[i], pal[i + 1], t - i); };
function draw(r, base) {
  const c = $('map'), g = c.getContext('2d'), nx = D.nx, ny = D.ny, S = c.width / nx, css = getComputedStyle(document.documentElement);
  const houseC = hex(css.getPropertyValue('--house').trim()), bgC = hex(css.getPropertyValue('--panel').trim()), homeC = css.getPropertyValue('--home').trim();
  const img = g.createImageData(nx, ny); let m = 0;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const k = j * nx + i, row = ny - 1 - j, o = 4 * (row * nx + i); let col = bgC;
    if (D.house[k]) col = houseC;
    else if (D.mask[k]) {
      const mm = D.midx[k];
      if (mode === 'depth') { const d = r.depth[mm]; col = d < 0.01 ? bgC : ramp(SEQ, Math.sqrt(d / 0.3)); }
      else if (mode === 'change') { const dd = r.depth[mm] - base.depth[mm]; col = Math.abs(dd) < 0.002 ? bgC : ramp(DIV, 0.5 + dd / 0.06); }
      else { const s = 2 * D.k * r.sd[mm]; col = (r.depth[mm] < 0.005 && s < 0.01) ? bgC : ramp(SEQ, s / 0.06); }
    }
    img.data.set([...col, 255], o);
  }
  const off = new OffscreenCanvas(nx, ny); off.getContext('2d').putImageData(img, 0, 0);
  g.imageSmoothingEnabled = false; g.clearRect(0, 0, c.width, c.height); g.drawImage(off, 0, 0, c.width, c.height);
  // the home lot outline and labels
  const x0 = D.home * 16, y0 = 10; g.strokeStyle = homeC; g.lineWidth = 2; g.setLineDash([6, 4]); g.strokeRect(x0 * S + 1, 0, 16 * S - 2, (ny - y0) * S); g.setLineDash([]);
  g.fillStyle = homeC; g.font = `600 ${Math.round(S * 1.7)}px Inter, system-ui, sans-serif`; g.fillText('YOUR LOT', x0 * S + 6, S * 2.2);
  g.fillStyle = css.getPropertyValue('--muted').trim(); g.fillText('STREET  →  drains east', 6, (ny - 3) * S);
  g.fillText('neighbor', (D.neighbor * 16 + 2) * S, S * 2.2);
  const [lo, hi, note] = mode === 'depth' ? ['dry', '12 in+', 'deepest water during the storm'] : mode === 'change' ? ['1.2 in drier', '1.2 in wetter', 'versus the same storm with no fixes'] : ['sure', '±2.4 in', 'calibrated ±2σ of the emulator'];
  $('k-lo').textContent = lo; $('k-hi').textContent = hi; $('k-note').textContent = note;
  $('ramp').style.background = `linear-gradient(90deg, ${(mode === 'change' ? DIV : SEQ).map(c => `rgb(${c})`).join(',')})`;
}
const inch = (m) => m < 0.0025 ? 'under 0.1 in' : `${(m / 0.0254).toFixed(1)} in`;
function update() {
  for (const p of D.params) $('o-' + p.key).textContent = fmt[p.key](vals[p.key]);
  const r = evaluate(vals), base = evaluate({ ...vals, french: 0, garden: 0, barrel: 0, redirect: 0, trees: 0 });
  draw(r, base);
  // the cascade decision for this request (src/cascade.js rules)
  let worst = 0; for (const m of D.region) worst = Math.max(worst, 2 * D.k * r.sd[m]);
  const wallSd = 2 * D.k * r.sc.wallPeak.sd, gap = gapTo(r.u), reasons = [];
  if (gap > 1.5) reasons.push('few full simulations near these settings');
  if (worst > D.tol.depth) reasons.push(`water depth on your lot could be off by up to ${inch(worst)}`);
  if (wallSd > D.tol.scalars.wallPeak) reasons.push(`water at your back wall could be off by ${inch(wallSd)}`);
  $('verdict').innerHTML = reasons.length
    ? `<span class="pill warn">Run full simulation</span><span>The emulator is not sure enough here: ${reasons.join('; ')}. In the product this request goes to the full flood model (about 2 minutes on this block) and that run is added to what the emulator knows.</span>`
    : `<span class="pill ok">Emulator answer</span><span>Within ±${inch(Math.max(worst, wallSd))} of what the full flood model would say on your lot (calibrated on runs it never saw). Answered in a few milliseconds.</span>`;
  const w = r.sc.wallPeak.mean, w0 = base.sc.wallPeak.mean, v = r.sc.yardVolPeak.mean, v0 = base.sc.yardVolPeak.mean, h = r.sc.lowWetHours.mean, h0 = base.sc.lowWetHours.mean;
  const chg = (a, b, f) => Math.abs(a - b) < 1e-9 ? 'no fixes set' : `${a < b ? '' : '+'}${f(a - b)} vs no fixes`;
  $('stats').innerHTML = `
    <div class="stat"><div class="k">Water against your back wall</div><div class="v">${inch(Math.max(0, w))}</div><div class="d">±${inch(wallSd)} · ${chg(w, w0, x => (x / 0.0254).toFixed(1) + ' in')}</div></div>
    <div class="stat"><div class="k">Water standing in the back yard</div><div class="v">${Math.round(Math.max(0, v) * 264.2).toLocaleString()} gal</div><div class="d">${chg(v, v0, x => Math.round(x * 264.2).toLocaleString() + ' gal')}</div></div>
    <div class="stat"><div class="k">Low spot under water (over ¾ in)</div><div class="v">${Math.max(0, h).toFixed(1)} h</div><div class="d">counted to 2 h after the storm starts · ${chg(h, h0, x => x.toFixed(1) + ' h')}</div></div>`;
}
fetch('whatif.json').then(r => r.json()).then(j => {
  D = j; em = deserialize(D.em, Object.fromEntries(Object.entries(D.blobs).map(([k, v]) => [k, fromB64(v)])));
  D.midx = new Int32Array(D.mask.length).fill(-1); let m = 0; for (let k = 0; k < D.mask.length; k++) if (D.mask[k]) D.midx[k] = m++; D.M = m;
  D.region = []; for (let k = 0; k < D.mask.length; k++) if (D.mask[k] && D.lot[k] === D.home) D.region.push(D.midx[k]);
  D.ell = (() => { const g = em.field.gps.slice(0, 4), d = em.X[0].length; return Array.from({ length: d }, (_, j) => g.reduce((s, q) => s + q.ell[j], 0) / g.length); })();
  vals = { ari: 10, wet: 0.5, raise: 0.3, french: 0, garden: 0, barrel: 0, redirect: 0, trees: 0 };
  build(); sync(); update();
  const V = D.validation;
  $('fine').innerHTML = `<b>What this is.</b> A screening tool on a made-up block, not your property and not an engineering design. The full flood model is FloodSim's CPU solver (shallow-water, 1 m grid, Atlas 14 one-hour storms for Philadelphia). The emulator on this page learned from all ${D.runs} of its runs. In the test, trained on 81 of them and checked at 40 settings it never saw, its worst error on your lot had a median of ${inch(V.emulatorOnly.maxAbs.median)}; the sure-enough answers stayed within ${inch(V.cascade.maxAbs.max)}, and ${Math.round(100 * V.cascade.solverShare)} % of those settings were sent to the full model. Fixes are modelled simply: a French drain is a gravel trench to the street, a rain garden is storage on the low spot, a barrel keeps the first gallons off the back roof, redirect sends that roof to the front, and trees catch a little rain and soak a little more in.`;
}).catch(e => { $('verdict').textContent = 'The emulator data did not load (' + e.message + '). Reload the page to try again.'; });
</script>
